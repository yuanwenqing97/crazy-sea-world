plugins {
    id 'com.android.application'
}

android {
    namespace 'com.driftingera.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.driftingera.game.v4'
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName '4.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
